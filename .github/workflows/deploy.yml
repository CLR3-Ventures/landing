name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # SITE TAKEN DOWN. Revert this commit to restore the full build.
      - name: Write holding page
        run: |
          rm -rf out && mkdir -p out
          cp public/CNAME public/.nojekyll out/
          cat > out/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>CLR3</title></head><body></body></html>
          HTML
          cp out/index.html out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
